version: '3.8'

services:
  llmock-server:
    build: .
    ports:
      # This machine only. Use "8001:8001" to let other machines reach the mock
      - "127.0.0.1:8001:8001"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    volumes:
      - ./.llmockrc.json:/app/.llmockrc.json:ro
