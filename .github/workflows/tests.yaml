name: standard checks

on:
    workflow_dispatch:
    pull_request:
        types: [opened, edited, synchronize]

env:
    HUSKY: 0

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: '24'
                  cache: 'npm'
            - run: npm ci
            - run: npm run lint -- --deny-warnings

    prettier:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: '24'
                  cache: 'npm'
            - run: npm ci
            - run: npm run pretty

    audit:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: '24'
                  cache: 'npm'
            - run: npm ci
            - run: npm audit --omit=dev

    unit_tests:
        needs: [lint, prettier, audit]
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: '24'
                  cache: 'npm'
            - run: npm ci
            - run: npm run test:unit

    e2e_tests:
        needs: [unit_tests]
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - uses: actions/setup-node@v6
              with:
                  node-version: '24'
                  cache: 'npm'

            - name: Cache Cypress binary
              uses: actions/cache@v5
              with:
                  path: ~/.cache/Cypress
                  key: cypress-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

            - run: npm ci

            - name: Verify Cypress
              run: npx cypress verify

            - run: npm run test:e2e