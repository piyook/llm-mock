name: standard checks

on:
    push:
      branches:
        - main
    workflow_dispatch:
    pull_request:
        types: [opened, edited, synchronize]

env:
    HUSKY: 0

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: '24'
                  cache: 'npm'
            - run: npm ci
            - run: npx biome ci --error-on-warnings

    audit:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: '24'
                  cache: 'npm'
            - run: npm ci
            - run: npm audit --omit=dev

    typecheck:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: '24'
                  cache: 'npm'
            - run: npm ci
            - run: npm run typecheck

    fallow:
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0
            - uses: actions/setup-node@v6
              with:
                  node-version: '24'
                  cache: 'npm'
            - run: npm ci
            - run: npx fallow audit --base origin/${{ github.base_ref }}

    unit_tests:
        needs: [lint, audit, typecheck, fallow]
        if: always()
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: '24'
                  cache: 'npm'
            - run: npm ci
            - run: npm run test:unit

    e2e_tests:
        needs: [unit_tests]
        if: always()
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - uses: actions/setup-node@v6
              with:
                  node-version: '24'
                  cache: 'npm'

            - name: Cache Cypress binary
              uses: actions/cache@v5
              with:
                  path: ~/.cache/Cypress
                  key: cypress-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

            - run: npm ci

            - name: Verify Cypress
              run: npx cypress verify

            # Full server and Cypress output in the CI log (local runs print a summary)
            - run: npm run test:e2e
              env:
                  E2E_VERBOSE: 'true'